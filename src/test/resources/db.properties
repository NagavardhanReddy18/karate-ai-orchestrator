# ─────────────────────────────────────────────────────────────────────────────
# db.properties — database credentials for the Excel `dbQuery` / `verify` columns
#
# Credentials live HERE and nowhere else. Never put a URL, user or password in a
# .feature file or in an Excel sheet — the same rule karate-config.js already
# states for the application accounts.
#
# Every key can be overridden from the command line, which is how staging and
# production credentials are supplied (never committed):
#
#   mvn test -pl beyond-lo-tests \
#       -Ddb.url=jdbc:postgresql://host:5432/beyondlo \
#       -Ddb.username=someone -Ddb.password=secret
#
# A system property always wins over the value below.
# ─────────────────────────────────────────────────────────────────────────────

# ── Default connection ───────────────────────────────────────────────────────
# Used by every query that does not name a database explicitly, i.e.
#   DB(select count(*) from lo_application where id = '@AppId')
#
# Host defaults to the dev application host from karate-config.js
# (config.baseUrl = http://164.52.210.93:9190/api). beyond-lo-app's
# application.yml points at localhost:5432/beyondlo with user `postgres`, so on a
# machine running the server locally, override db.url to jdbc:postgresql://localhost:5432/beyondlo
# ── Default / 9090 Dev Connection ────────────────────────────────────────────
db.driverClassName=org.postgresql.Driver
# 2026-09-22: the default connection now points at the database behind the 9090 dev server
# (164.52.210.93:5433/beyondsuite). The previous default (jdbc:postgresql://164.52.216.241:5432/beyondlo, user beyondlo) is a
# different, stale database (no AUTO_* product types, migration level 68) that no test server uses.
db.url=jdbc:postgresql://164.52.210.93:5433/beyondsuite
db.username=postgres
db.password=Password123

# ── 9190 Test Connection ──────────────────────────────────────────────────────
db.test.driverClassName=org.postgresql.Driver
db.test.url=jdbc:postgresql://164.52.210.93:5434/beyondsuite_test
db.test.username=postgres
db.test.password=Password123

# ── Additional named connections ─────────────────────────────────────────────
# Declare as many as you need with db.<name>.<key>. A query targets one by
# prefixing the database name and a colon:
#
#   DB(cbs: select count(*) from accounts where acct_no = '@CbsAccountNumber')
#
# Anything not overridden here falls back to the default connection above, so a
# second schema on the same server only needs its url line.
#
#db.cbs.driverClassName=org.postgresql.Driver
#db.cbs.url=jdbc:postgresql://164.52.210.93:5432/cbs
#db.cbs.username=postgres
#db.cbs.password=Password123

# ── Behaviour ────────────────────────────────────────────────────────────────
# Seconds a query may run before it is abandoned and the check fails.
db.queryTimeoutSeconds=30

# Print every SQL statement and its result to the Karate log. Helpful while
# authoring a sheet; noisy in a full regression run.
db.logQueries=true
