# ==============================================================================
# Karate Autonomous QA Agent — Server & Jenkins Configuration
# ==============================================================================
# Edit paths below to match your local machine or Jenkins build agent.
# Relative paths are resolved from the karate-Autonomous-QA-Agent root folder.

# JDK Home (leave blank to use system JAVA_HOME / PATH)
jdk.home=C:/Program Files/Java/jdk-17.0.0.1

# JVM Options passed via MAVEN_OPTS during Maven/Karate execution
jvm.options=-Xms512m -Xmx2048m -Dfile.encoding=UTF-8

# Maven executable (mvn or full path e.g. C:/apache-maven/bin/mvn.cmd)
maven.cmd=mvn

# Local Autonomous QA Brain folder (stores backups, reports, logs, tools)
agent.brain.dir=./brain

# Target Beyond LO / CBS Environment: local | dev | staging | test | 9190
karate.env=9190

# Optional explicit baseUrl override (leave empty to derive from karate.env)
lo.test.baseUrl=

# Karate features to run (comma-separated aliases or classpath paths)
karate.features=classpath:features/loans/04-BLO-LifeCycle.feature

# Enable/disable autonomous CBS config self-healing and Excel write-back
karate.agent.heal=true
karate.agent.writeExcel=true
